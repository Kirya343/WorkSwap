name: Docker

on:
    push:
        branches:
            - main

env:
    REGISTRY: ghcr.io

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: maven

            - name: Configure Maven
              run: |
                  mkdir -p ~/.m2
                  cat > ~/.m2/settings.xml <<EOF
                  <settings>
                      <servers>
                          <server>
                              <id>github</id>
                              <username>${{ github.actor }}</username>
                              <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>
                          </server>
                      </servers>
                  </settings>
                  EOF

            - name: Build applications
              run: mvn-f Backend/pom.xml install -DskipTests

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push server
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend/apps/Sso
                  file: ./Backend/apps/Sso/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/workswap-sso:latest
                      ghcr.io/${{ github.repository_owner }}/workswap-sso:${{ github.sha }}

            - name: Build and push server
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend/apps/Server
                  file: ./Backend/apps/Server/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/workswap-server:latest
                      ghcr.io/${{ github.repository_owner }}/workswap-server:${{ github.sha }}

            - name: Build and push statistics
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend/apps/Statistic
                  file: ./Backend/apps/Statistic/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/workswap-statistics:latest
                      ghcr.io/${{ github.repository_owner }}/workswap-statistics:${{ github.sha }}

                      

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: yarn

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build marketplace
              run: yarn workspace workswap-marketplace build

            - name: Build admin
              run: yarn workspace workswap-admin build

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push marketplace
              uses: docker/build-push-action@v6
              with:
                  context: ./Frontend/packages/marketplace
                  file: ./Frontend/packages/marketplace/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/workswap-frontend:latest
                      ghcr.io/${{ github.repository_owner }}/workswap-frontend:${{ github.sha }}

            - name: Build and push admin
              uses: docker/build-push-action@v6
              with:
                  context: ./Frontend/packages/admin
                  file: ./Frontend/packages/admin/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/workswap-admin:latest
                      ghcr.io/${{ github.repository_owner }}/workswap-admin:${{ github.sha }}